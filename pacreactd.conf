# pacreactd settings. This file is read from /etc/pac/pacreactd.conf, then from
# ~/.config/pac/pacreactd.conf, then from the current folder, each overriding the earlier. Settings
# come from these files only, not from the environment. Read when the daemon starts: restart it to
# apply.
#
# What a key is called and what its value means is in docs/protocol.md. The thresholds below say when
# a key gets a level (warning, critical). How an event is shown, or whether it is, is pacreact's.

# --- Temperature ------------------------------------------------------------

# Temperature: 0 turns it off; warn and crit are degrees Celsius.
# temp = 1
# temp_warn = 85
# temp_crit = 95
# Seconds between looks while everything is cool (it looks faster as a sensor warms); 0 looks only
# when the kernel says a thermal event happened.
# temp_interval = 120

# --- Webcam and USB devices -----------------------------------------------

# 0 turns the webcam-in-use key (camera.active) off.
# camera = 1

# 0 turns the USB devices (usb.*) off. Which kinds are announced is pacreact's `usb` setting.
# usb = 1
# 0 turns the keyboards, mice, touchpads, tablets and gamepads (input.*) off.
# input = 1

# --- Screen, lock keys, Bluetooth, disk space, network probe ----------------

# 1 watches the keyboards for Caps Lock and Num Lock (lock.caps, lock.num), with a kernel filter that lets only LED events
# through, so that no key press ever reaches the daemon. Off unless set.
# lock_keys = 1

# 0 turns the Bluetooth device events (bt.event) off.
# bluetooth = 1

# Disk space: 0 turns it off; warn and crit are free space in percent; the interval is the seconds between looks
# (the kernel does not say a disk is filling), 0 looking only when the mount table changes.
# disk = 1
# disk_warn = 10
# disk_crit = 5
# disk_interval = 300

# IPv4 address to ping for the slowdown key (net.probe); unset means no probe. Needs an unprivileged ping socket
# (net.ipv4.ping_group_range).
# probe_host = 1.1.1.1
# probe_interval = 30

# --- Wifi signal -------------------------------------------------------------

# Where net.signal comes from. NetworkManager and iwd tell when the signal moves, over the system bus: auto asks NetworkManager if
# it runs, else iwd (which lets only members of the wheel or network group ask it anything), else the kernel's counter, which is
# read when the link changes and no more, as the kernel sends an ordinary program no event when a signal drifts. networkmanager or iwd
# says to ask only that one; sysfs, only the counter.
# net_signal_source = auto

# For the counter alone: a number of seconds (5 to 3600) looks at it that often while on wifi, and says it when it has moved by 5
# points. A timer, so off unless set, and not used while NetworkManager or iwd tell.
# net_signal_interval = 0

# --- Printing -----------------------------------------------------------------

# 0 turns the print watcher off (printer.state, printer.event). Which messages are shown is pacreact's `print` setting.
# print = 1

# yes prints what CUPS and the bus said, on standard error. For bug reports.
# print_debug = no

# --- Audio jacks ------------------------------------------------------------

# auto names what was plugged in from what the sound server says; generic says only "an audio device" (for a codec that
# reports one connector as headphones one time and a microphone the next); 0 turns jacks off.
# jacks = auto

# yes prints what the jack switches and the sound server said, and when, to find out why a plug is named as it is.
# jacks_debug = no
